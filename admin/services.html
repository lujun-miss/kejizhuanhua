    <a href="achievements.html" class="menu-item flex items-center gap-3 px-5 py-2.5 text-sm text-gray-600"><i class="fa-solid fa-flask-vial w-4"></i>成果审核</a>

  <main class="flex-1 p-6 overflow-y-auto">
    <div class="flex items-center justify-between mb-5">
      <div><h1 class="text-xl font-bold">服务内容管理</h1><p class="text-sm text-gray-400 mt-1">对应前台「服务大厅」· 服务包/技术经理人/政策资讯 统一维护</p></div>
      <button class="text-sm bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700"><i class="fa-solid fa-plus mr-1 text-xs"></i>新增内容</button>
    </div>

    <!-- 子Tab -->
    <div class="flex gap-1 bg-white rounded-xl p-1 mb-4 w-fit">

      <button class="text-sm text-gray-500 px-4 py-2 rounded-lg hover:bg-gray-50">政策资讯</button>
      <button class="text-sm text-gray-500 px-4 py-2 rounded-lg hover:bg-gray-50">活动路演</button>
    </div>

    <!-- 服务包表格 -->
    <div class="bg-white rounded-2xl overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-500 text-xs"><tr><th class="text-left px-5 py-3 font-medium">服务名称</th><th class="text-left px-5 py-3 font-medium">分类</th><th class="text-left px-5 py-3 font-medium">价格</th><th class="text-left px-5 py-3 font-medium">服务次数</th><th class="text-left px-5 py-3 font-medium">状态</th><th class="text-left px-5 py-3 font-medium">排序</th><th class="text-right px-5 py-3 font-medium">操作</th></tr></thead>
        <tbody class="divide-y divide-gray-50">
          <tr class="tr-hover"><td class="px-5 py-4"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-gradient-to-br from-blue-500 to-cyan-500 text-white flex items-center justify-center text-sm"><i class="fa-solid fa-gauge-high"></i></div><span class="font-medium">科技成果评价报告</span></div></td><td class="px-5 py-4"><span class="text-xs bg-primary-50 text-primary-600 px-2 py-1 rounded">成果评价</span></td><td class="px-5 py-4 font-medium text-orange-500">¥8,800起</td><td class="px-5 py-4 text-gray-600">1,204</td><td class="px-5 py-4"><span class="text-xs bg-emerald-50 text-emerald-600 px-2 py-1 rounded">上架中</span></td><td class="px-5 py-4 text-gray-400">1</td><td class="px-5 py-4 text-right"><button class="text-xs text-gray-500 hover:text-primary-600">编辑</button><button class="text-xs text-gray-500 ml-3 hover:text-red-500">下架</button></td></tr>
          <tr class="tr-hover"><td class="px-5 py-4"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-gradient-to-br from-amber-500 to-orange-500 text-white flex items-center justify-center text-sm"><i class="fa-solid fa-file-contract"></i></div><span class="font-medium">转化全流程合规套餐</span></div></td><td class="px-5 py-4"><span class="text-xs bg-rose-50 text-rose-600 px-2 py-1 rounded">法律咨询</span></td><td class="px-5 py-4 font-medium text-orange-500">¥25,000起</td><td class="px-5 py-4 text-gray-600">316</td><td class="px-5 py-4"><span class="text-xs bg-emerald-50 text-emerald-600 px-2 py-1 rounded">上架中</span></td><td class="px-5 py-4 text-gray-400">2</td><td class="px-5 py-4 text-right"><button class="text-xs text-gray-500 hover:text-primary-600">编辑</button><button class="text-xs text-gray-500 ml-3 hover:text-red-500">下架</button></td></tr>
          <tr class="tr-hover"><td class="px-5 py-4"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-gradient-to-br from-emerald-500 to-teal-500 text-white flex items-center justify-center text-sm"><i class="fa-solid fa-hand-holding-dollar"></i></div><span class="font-medium">科技融资对接</span></div></td><td class="px-5 py-4"><span class="text-xs bg-emerald-50 text-emerald-600 px-2 py-1 rounded">融资对接</span></td><td class="px-5 py-4 font-medium text-orange-500">费率3%起</td><td class="px-5 py-4 text-gray-600">89</td><td class="px-5 py-4"><span class="text-xs bg-emerald-50 text-emerald-600 px-2 py-1 rounded">上架中</span></td><td class="px-5 py-4 text-gray-400">3</td><td class="px-5 py-4 text-right"><button class="text-xs text-gray-500 hover:text-primary-600">编辑</button><button class="text-xs text-gray-500 ml-3 hover:text-red-500">下架</button></td></tr>
